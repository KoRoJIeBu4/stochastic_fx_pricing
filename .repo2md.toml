[output]
file = "project-context.md"
include_tree = true
include_contents = true

[scan]
respect_gitignore = true
follow_symlinks = false
max_file_size_kb = 256
max_total_size_mb = 10

[exclude]
patterns = [
    ".env*",
    "*.pem",
    "*.key",
    "node_modules/",
    ".venv/",
    "__pycache__/",
    "dist/",
    "*.log"
]

[security]
scan_secrets = true
